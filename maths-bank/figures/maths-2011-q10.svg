<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 235" role="img" aria-labelledby="title desc">
<title id="title">Venn diagram of P and Q</title><desc id="desc">In universe U, b is only in P, c is in both P and Q, d is only in Q, and a and e are outside both.</desc>
<rect x="0" y="0" width="470" height="235" rx="12" fill="#f8fafc" stroke="none"/>
<g font-family="system-ui, sans-serif">
<rect x="33" y="27" width="404" height="182" rx="3" fill="#ffffff" stroke="#1e293b"/>
<circle cx="186" cy="119" r="72" fill="#2563eb12" stroke="#1d4ed8" stroke-width="2.5"/>
<circle cx="275" cy="119" r="72" fill="#10b98115" stroke="#047857" stroke-width="2.5"/>
<text x="49" y="49" text-anchor="middle" font-size="18" fill="#1e293b">U</text>
<text x="154" y="88" text-anchor="middle" font-size="18" fill="#1e293b">P</text>
<text x="305" y="88" text-anchor="middle" font-size="18" fill="#1e293b">Q</text>
<text x="146" y="129" text-anchor="middle" font-size="18" fill="#1e293b">b</text>
<text x="230" y="129" text-anchor="middle" font-size="18" fill="#1e293b">c</text>
<text x="309" y="129" text-anchor="middle" font-size="18" fill="#1e293b">d</text>
<text x="70" y="180" text-anchor="middle" font-size="18" fill="#1e293b">a</text>
<text x="399" y="180" text-anchor="middle" font-size="18" fill="#1e293b">e</text>
</g>
</svg>
