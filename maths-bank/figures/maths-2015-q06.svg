<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 280" role="img" aria-labelledby="title desc">
<title id="title">Parallel lines PQ and RS</title><desc id="desc">P is above R, Q is above S, and PQ is parallel to RS. Lines PS and RQ cross. The angle at P within the upper triangle is 60 degrees. The left angle at the crossing is 100 degrees. The angle at R is x.</desc>
<rect x="0" y="0" width="490" height="280" rx="12" fill="#f8fafc" stroke="none"/>
<g font-family="system-ui, sans-serif">
<path d="M183 45 H342 M129 233 H292 M183 45 L292 233 M342 45 L129 233" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M250 39 l12 6 -12 6 M205 227 l12 6 -12 6" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M202 45 Q200 56 193 62 M218 111 Q195 133 213 160 M154 233 Q151 222 148 216" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="170" y="42" text-anchor="middle" font-size="18" fill="#1e293b">P</text>
<text x="352" y="42" text-anchor="middle" font-size="18" fill="#1e293b">Q</text>
<text x="112" y="250" text-anchor="middle" font-size="18" fill="#1e293b">R</text>
<text x="307" y="250" text-anchor="middle" font-size="18" fill="#1e293b">S</text>
<text x="220" y="72" text-anchor="middle" font-size="16" fill="#1e293b">60°</text>
<text x="177" y="140" text-anchor="middle" font-size="16" fill="#1e293b">100°</text>
<text x="170" y="223" text-anchor="middle" font-size="16" fill="#1e293b">x°</text>
</g>
</svg>
