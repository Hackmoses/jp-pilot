<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 570 268" role="img" aria-labelledby="title desc">
<title id="title">Two parallel lines and the transversal</title><desc id="desc">P, Q and S lie on one slanted line. Q to R and T to U are parallel horizontals. S joins U. Angle PQR is 80 degrees and angle PSU is 95 degrees.</desc>
<rect x="0" y="0" width="570" height="268" rx="12" fill="#f8fafc" stroke="none"/>
<g font-family="system-ui, sans-serif">
<path d="M114 184 L142 26 M134 72 H493 M184 220 H505 M124 126 L505 220" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M330 66 l12 6 -12 6 M330 214 l12 6 -12 6" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M138 51 Q161 51 161 72 M129 104 Q153 109 149 132 M468 220 Q469 214 471 212" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="151" y="26" text-anchor="middle" font-size="18" fill="#1e293b">P</text>
<text x="119" y="75" text-anchor="middle" font-size="18" fill="#1e293b">Q</text>
<text x="505" y="77" text-anchor="middle" font-size="18" fill="#1e293b">R</text>
<text x="106" y="131" text-anchor="middle" font-size="18" fill="#1e293b">S</text>
<text x="180" y="245" text-anchor="middle" font-size="18" fill="#1e293b">T</text>
<text x="516" y="230" text-anchor="middle" font-size="18" fill="#1e293b">U</text>
<text x="170" y="56" text-anchor="middle" font-size="16" fill="#1e293b">80°</text>
<text x="171" y="120" text-anchor="middle" font-size="16" fill="#1e293b">95°</text>
<text x="453" y="209" text-anchor="middle" font-size="16" fill="#1e293b">x°</text>
</g>
</svg>
