<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 482 250" role="img" aria-labelledby="title desc">
<title id="title">Triangle with two marked angles</title><desc id="desc">The triangle has a horizontal base. Its left base angle is 30 degrees and right base angle is 60 degrees. The side across from 30 degrees is 10 centimetres and the side across from 60 degrees is x.</desc>
<rect x="0" y="0" width="482" height="250" rx="12" fill="#f8fafc" stroke="none"/>
<g font-family="system-ui, sans-serif">
<path d="M42.00 202.00 L326.00 38.00 L421.00 202.00 Z" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M92 202 A50 50 0 0 0 85 177 M371 202 A50 50 0 0 1 396 159" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="109" y="188" text-anchor="middle" font-size="16" fill="#1e293b">30°</text>
<text x="367" y="183" text-anchor="middle" font-size="16" fill="#1e293b">60°</text>
<text x="177" y="107" text-anchor="middle" font-size="20" fill="#1e293b">x</text>
<text x="404" y="104" text-anchor="middle" font-size="18" fill="#1e293b">10 cm</text>
</g>
</svg>
