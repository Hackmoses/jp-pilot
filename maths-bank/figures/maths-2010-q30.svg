<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 281" role="img" aria-labelledby="title desc">
<title id="title">Cyclic quadrilateral TUVW</title><desc id="desc">Points T, U, V and W occur in order around one circle. Angle TUV is (3x + 20) degrees and angle VWT at W is 88 degrees.</desc>
<rect x="0" y="0" width="420" height="281" rx="12" fill="#f8fafc" stroke="none"/>
<g font-family="system-ui, sans-serif">
<circle cx="216" cy="142" r="114" fill="none" stroke="#1e293b" stroke-width="2.5"/>
<path d="M131.28 65.72 L289.28 54.67 L307.04 210.61 L132.63 219.75 Z" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M261 63 Q263 88 291 87" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M130 188 Q153 188 154 213" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="124" y="71" text-anchor="middle" font-size="18" fill="#1e293b">T</text>
<text x="305" y="58" text-anchor="middle" font-size="18" fill="#1e293b">U</text>
<text x="327" y="218" text-anchor="middle" font-size="18" fill="#1e293b">V</text>
<text x="112" y="236" text-anchor="middle" font-size="18" fill="#1e293b">W</text>
<text x="232" y="105" text-anchor="middle" font-size="18" fill="#1e293b">(3x + 20)°</text>
<text x="168" y="183" text-anchor="middle" font-size="18" fill="#1e293b">88°</text>
</g>
</svg>
