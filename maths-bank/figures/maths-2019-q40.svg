<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 320" role="img" aria-labelledby="title desc">
<title id="title">Diameter and perpendicular chord</title><desc id="desc">A vertical diameter runs from F at the top through O to H at the bottom. Chord EG crosses it at right angles at N below O. EG is 24 centimetres and NH is 8 centimetres.</desc>
<rect x="0" y="0" width="470" height="320" rx="12" fill="#f8fafc" stroke="none"/>
<g font-family="system-ui, sans-serif">
<circle cx="225" cy="155" r="109" fill="none" stroke="#1e293b" stroke-width="2.5"/>
<path d="M225 46 V264 M124.4 196.9 H325.6" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M213 197 V185 H225" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="225" cy="155" r="3" fill="#1d4ed8"/>
<circle cx="225" cy="197" r="3" fill="#1d4ed8"/>
<text x="225" y="32" text-anchor="middle" font-size="18" fill="#1e293b">F</text>
<text x="225" y="286" text-anchor="middle" font-size="18" fill="#1e293b">H</text>
<text x="242" y="150" text-anchor="middle" font-size="18" fill="#1e293b">O</text>
<text x="243" y="218" text-anchor="middle" font-size="18" fill="#1e293b">N</text>
<text x="108" y="203" text-anchor="middle" font-size="18" fill="#1e293b">E</text>
<text x="343" y="203" text-anchor="middle" font-size="18" fill="#1e293b">G</text>
<text x="287" y="186" text-anchor="middle" font-size="14" fill="#1e293b">EG = 24 cm</text>
<text x="287" y="247" text-anchor="middle" font-size="14" fill="#1e293b">NH = 8 cm</text>
</g>
</svg>
