<title id="title">Parallelogram and adjoining triangle</title><desc id="desc">T, S and R are in a straight line in that order. PQST is a parallelogram. TS is 10 centimetres, SR is 8 centimetres, and QRS is a triangle.</desc>
<rect x="0" y="0" width="520" height="270" rx="12" fill="#f8fafc" stroke="none"/>
<g font-family="system-ui, sans-serif">
<path d="M65.00 205.00 L151.00 83.00 L351.00 83.00 L436.00 205.00 Z" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M351 83 L265 205" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M240 76 l13 7 -13 7 M156 198 l13 7 -13 7 M99 150 l0 -13 -12 4 M299 150 l0 -13 -12 4" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="144" y="71" text-anchor="middle" font-size="18" fill="#1e293b">P</text>
<text x="361" y="73" text-anchor="middle" font-size="18" fill="#1e293b">Q</text>
<text x="50" y="218" text-anchor="middle" font-size="18" fill="#1e293b">T</text>
<text x="265" y="225" text-anchor="middle" font-size="18" fill="#1e293b">S</text>
<text x="448" y="220" text-anchor="middle" font-size="18" fill="#1e293b">R</text>
<text x="160" y="245" text-anchor="middle" font-size="18" fill="#1e293b">10 cm</text>
<text x="351" y="245" text-anchor="middle" font-size="18" fill="#1e293b">8 cm</text>
</g>
