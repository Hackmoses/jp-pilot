<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" role="img" aria-labelledby="title desc">
  <title id="title">Wavefronts passing through a narrow slit</title>
  <desc id="desc">Parallel incident plane wavefronts approach a barrier with a narrow opening and emerge on the far side as spreading circular wavefronts.</desc>
  <rect width="600" height="260" rx="12" fill="#fff"/>
  <g fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Incident wavefronts -->
    <line x1="150" y1="80" x2="150" y2="180"/>
    <line x1="175" y1="80" x2="175" y2="180"/>
    <line x1="200" y1="80" x2="200" y2="180"/>
    <line x1="225" y1="80" x2="225" y2="180"/>
    <path d="M120 130 H238 M228 124 L240 130 L228 136"/>
    <!-- Barrier with slit -->
    <rect x="270" y="30" width="24" height="86" fill="#e2e8f0"/>
    <rect x="270" y="144" width="24" height="86" fill="#e2e8f0"/>
    <!-- Emergent circular wavefronts centered at (294,130) -->
    <path d="M324 100 A42 42 0 0 1 324 160"/>
    <path d="M348 80 A72 72 0 0 1 348 180"/>
    <path d="M372 60 A102 102 0 0 1 372 200"/>
    <path d="M312 130 H430 M420 124 L432 130 L420 136"/>
  </g>
  <g fill="#0f172a" font-family="system-ui, sans-serif" font-size="16">
    <text x="114" y="122" text-anchor="end">Incident</text>
    <text x="114" y="142" text-anchor="end">waves</text>
    <text x="255" y="135" text-anchor="end" font-size="14">Slit</text>
    <text x="442" y="124">Emergent</text>
    <text x="442" y="144">waves</text>
  </g>
</svg>