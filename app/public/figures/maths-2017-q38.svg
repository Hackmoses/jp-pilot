<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 515 260" role="img" aria-labelledby="title desc">
<title id="title">Right triangular prism</title><desc id="desc">The congruent ends are OPV and RST, with OP equal to RS. O to P is 5 centimetres, R to T is 4 centimetres, and O to R is 8 centimetres. The angle RTS is a right angle.</desc>
<rect x="0" y="0" width="515" height="260" rx="12" fill="#f8fafc" stroke="none"/>
<g font-family="system-ui, sans-serif">
<path d="M65.00 126.00 L145.00 38.00 L145.00 108.00 Z" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M350.00 213.00 L430.00 125.00 L430.00 195.00 Z" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M65 126 L350 213 M145 38 L430 125 M145 108 L430 195" fill="none" stroke="#1e293b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M418 198 L418 186 L430 183" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="52" y="140" text-anchor="middle" font-size="18" fill="#1e293b">O</text>
<text x="145" y="28" text-anchor="middle" font-size="18" fill="#1e293b">P</text>
<text x="155" y="122" text-anchor="middle" font-size="18" fill="#1e293b">V</text>
<text x="349" y="237" text-anchor="middle" font-size="18" fill="#1e293b">R</text>
<text x="440" y="117" text-anchor="middle" font-size="18" fill="#1e293b">S</text>
<text x="445" y="210" text-anchor="middle" font-size="18" fill="#1e293b">T</text>
<text x="88" y="77" text-anchor="middle" font-size="18" fill="#1e293b">5 cm</text>
<text x="227" y="186" text-anchor="middle" font-size="18" fill="#1e293b">8 cm</text>
<text x="402" y="231" text-anchor="middle" font-size="18" fill="#1e293b">4 cm</text>
</g>
</svg>
