<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" role="img" aria-labelledby="title desc">
  <title id="title">Displacement-time wave graph</title>
  <desc id="desc">A sinusoidal wave plotted with Displacement in cm against Time in s. The amplitude is 0.01 cm and complete cycles cross the axis at 0, 0.1, 0.2, 0.3 and 0.4 s.</desc>
  <rect width="600" height="260" rx="12" fill="#fff"/>
  <g fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M70 230V30 M70 130H540"/>
    <path d="M64 40L70 28L76 40 M530 124L542 130L530 136"/>
    <!-- Wave: 2.25 cycles, period = 200 px (0.2s -> x=70+200=270, 0.4s -> x=470) -->
    <path d="M70 130 C95 60 145 60 170 130 C195 200 245 200 270 130 C295 60 345 60 370 130 C395 200 445 200 470 130 C485 90 505 70 520 78" stroke-width="3"/>
    <!-- Amplitude vertical lines at x=120 and x=220 -->
    <line x1="120" y1="130" x2="120" y2="78" stroke-width="2"/>
    <line x1="220" y1="130" x2="220" y2="182" stroke-width="2"/>
  </g>
  <g fill="#0f172a" font-family="system-ui, sans-serif" font-size="16">
    <text x="82" y="34" font-weight="600">Displacement (cm)</text>
    <text x="515" y="156" font-weight="600">Time (s)</text>
    <text x="125" y="112" font-size="14">0.01</text>
    <text x="225" y="160" font-size="14">0.01</text>
    <text x="172" y="152" text-anchor="start">0.1</text>
    <text x="272" y="152" text-anchor="start">0.2</text>
    <text x="372" y="152" text-anchor="start">0.3</text>
    <text x="472" y="152" text-anchor="start">0.4</text>
  </g>
</svg>