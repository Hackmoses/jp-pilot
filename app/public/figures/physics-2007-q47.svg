<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" role="img" aria-labelledby="title desc">
  <title id="title">Uniform 50 cm rod balanced on a fulcrum</title>
  <desc id="desc">A 50 cm horizontal rod marked at 0, 5, 15, 45 and 50 cm is pivoted on fulcrum F at the 15 cm mark, with a 200 N weight hung at 5 cm and a 40 N weight hung at 45 cm.</desc>
  <rect width="600" height="250" rx="12" fill="#fff"/>
  <g fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <rect x="70" y="65" width="460" height="22" fill="#f8fafc"/>
    <!-- Fulcrum at 15 cm: x = 70 + 15/50 * 460 = 208 -->
    <polygon points="208,87 192,120 224,120" fill="#0f172a"/>
    <!-- 200 N at 5 cm: x = 70 + 5/50 * 460 = 116 -->
    <line x1="116" y1="87" x2="116" y2="155"/>
    <rect x="92" y="155" width="48" height="40" fill="#fff"/>
    <!-- 40 N at 45 cm: x = 70 + 45/50 * 460 = 484 -->
    <line x1="484" y1="87" x2="484" y2="155"/>
    <rect x="460" y="155" width="48" height="40" fill="#fff"/>
  </g>
  <g fill="#0f172a" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">
    <text x="70" y="54">0</text>
    <text x="116" y="54">5</text>
    <text x="208" y="54">15</text>
    <text x="484" y="54">45</text>
    <text x="530" y="54">50 cm</text>
    <text x="208" y="142" font-weight="600">F</text>
    <text x="116" y="181">200 N</text>
    <text x="484" y="181">40 N</text>
  </g>
</svg>