<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" role="img" aria-labelledby="title desc">
  <title id="title">Coupled pendula on a horizontal string</title>
  <desc id="desc">Six pendula P, Q, R, S, T and U suspended from a taut horizontal frame. Pendula P and T have identical lengths; Q and S are longer, R is shorter and U is longest.</desc>
  <rect width="600" height="250" rx="12" fill="#fff"/>
  <g fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <line x1="70" y1="45" x2="530" y2="45" stroke-width="4"/>
    <!-- P (len 65), Q (110), R (35), S (135), T (65), U (170) -->
    <line x1="105" y1="45" x2="105" y2="110"/><circle cx="105" cy="119" r="9" fill="#fff"/>
    <line x1="185" y1="45" x2="185" y2="155"/><circle cx="185" cy="164" r="9" fill="#fff"/>
    <line x1="265" y1="45" x2="265" y2="80"/><circle cx="265" cy="89" r="9" fill="#fff"/>
    <line x1="345" y1="45" x2="345" y2="180"/><circle cx="345" cy="189" r="9" fill="#fff"/>
    <line x1="425" y1="45" x2="425" y2="110"/><circle cx="425" cy="119" r="9" fill="#fff"/>
    <line x1="505" y1="45" x2="505" y2="215"/><circle cx="505" cy="224" r="9" fill="#fff"/>
  </g>
  <g fill="#0f172a" font-family="system-ui, sans-serif" font-size="16" font-weight="600">
    <text x="118" y="68">P</text>
    <text x="198" y="68">Q</text>
    <text x="278" y="68">R</text>
    <text x="358" y="68">S</text>
    <text x="438" y="68">T</text>
    <text x="518" y="68">U</text>
  </g>
</svg>