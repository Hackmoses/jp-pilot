<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" role="img" aria-labelledby="title desc">
  <title id="title">Wooden block on an inclined plane at angle alpha</title>
  <desc id="desc">A wooden block resting on an inclined plane raised at an angle alpha to the horizontal base.</desc>
  <rect width="560" height="240" rx="12" fill="#fff"/>
  <g fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <line x1="90" y1="195" x2="470" y2="195"/>
    <line x1="90" y1="195" x2="430" y2="45"/>
    <!-- Block rotated on slope ~ -23.8 deg -->
    <g transform="translate(275,113) rotate(-23.8)">
      <rect x="-48" y="-32" width="96" height="32" fill="#f8fafc"/>
      <text x="0" y="-10" fill="#0f172a" stroke="none" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">Block</text>
    </g>
    <path d="M160 195 A70 70 0 0 0 154 167" stroke-width="2"/>
  </g>
  <text x="176" y="183" fill="#0f172a" font-family="system-ui, sans-serif" font-size="20">α</text>
</svg>