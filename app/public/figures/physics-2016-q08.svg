<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" role="img" aria-labelledby="title desc">
  <title id="title">Cell E driving 4.0 A into parallel 3-ohm and 6-ohm resistors</title>
  <desc id="desc">A cell of e.m.f. E and negligible internal resistance supplies a total current of 4.0 A into two resistors of 3 ohms and 6 ohms connected in parallel.</desc>
  <rect width="560" height="260" rx="12" fill="#fff"/>
  <g fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M130 120 V45 H420 V90 M420 170 V215 H130 V138"/>
    <path d="M295 45 V90 M295 170 V215"/>
    <!-- Battery -->
    <line x1="108" y1="120" x2="152" y2="120"/>
    <line x1="118" y1="138" x2="142" y2="138" stroke-width="4.5"/>
    <!-- Ammeter / current label box -->
    <rect x="180" y="30" width="66" height="30" rx="4" fill="#fff"/>
    <!-- 3 ohm & 6 ohm resistors -->
    <rect x="279" y="90" width="32" height="80" fill="#fff"/>
    <rect x="404" y="90" width="32" height="80" fill="#fff"/>
  </g>
  <g fill="#0f172a" font-family="system-ui, sans-serif" font-size="17">
    <text x="96" y="135" text-anchor="end" font-weight="600">E</text>
    <text x="213" y="51" text-anchor="middle">4.0 A</text>
    <text x="320" y="136">3 Ω</text>
    <text x="446" y="136">6 Ω</text>
  </g>
</svg>