<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-labelledby="title desc">
  <title id="title">Block-and-tackle pulley system with four pulleys</title>
  <desc id="desc">A block-and-tackle pulley system with two upper pulleys and two lower pulleys supporting a 1200 N load with effort E pulling downwards.</desc>
  <rect width="520" height="300" rx="12" fill="#fff"/>
  <g fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Ceiling -->
    <line x1="150" y1="26" x2="310" y2="26" stroke-width="4"/>
    <line x1="220" y1="26" x2="220" y2="132"/>
    <!-- 4 pulleys vertically stacked: upper block (y=72, y=118), lower block (y=172, y=214) -->
    <circle cx="220" cy="70" r="22" fill="#fff"/>
    <circle cx="220" cy="116" r="18" fill="#fff"/>
    <line x1="220" y1="168" x2="220" y2="245"/>
    <circle cx="220" cy="172" r="18" fill="#fff"/>
    <circle cx="220" cy="216" r="22" fill="#fff"/>
    <!-- Frame bars -->
    <rect x="216" y="42" width="8" height="92" fill="#0f172a"/>
    <rect x="216" y="148" width="8" height="92" fill="#0f172a"/>
    <!-- 4 rope segments + effort pull -->
    <path d="M198 70 V216 M202 116 V172 M238 116 V172 M242 70 L282 145"/>
    <path d="M273 140 L283 147 L283 135"/>
    <!-- Load trapezoid 1200 N -->
    <polygon points="180,245 260,245 274,282 166,282" fill="#f8fafc"/>
  </g>
  <g fill="#0f172a" font-family="system-ui, sans-serif" font-size="17" text-anchor="middle">
    <text x="296" y="148" text-anchor="start" font-weight="600">E</text>
    <text x="220" y="270" font-weight="600">1200 N</text>
  </g>
</svg>