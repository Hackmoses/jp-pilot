2012-40-efficiency","deck":"antonyms","front":"efficiency","meaning":"Working well with little waste of time or effort.","example":"The nurse ran the clinic queue with efficiency.","antonym":"incompetence","jamb":{"year":2012,"number":40}},{"id":"ant-2012-40-incompetence","deck":"antonyms","front":"incompetence","meaning":"Failure to do a task with the skill it requires.","example":"The union blamed the delay on the contractor's incompetence.","antonym":"efficiency","jamb":{"year":2012,"number":40}},{"id":"ant-2012-41-reticent","deck":"antonyms","front":"reticent","meaning":"Unwilling to speak freely about something.","example":"Tayo was reticent about his plans after school.","antonym":"loquacious","jamb":{"year":2012,"number":41}},{"id":"ant-2012-41-loquacious","deck":"antonyms","front":"loquacious","meaning":"Inclined to talk a great deal.","example":"Our loquacious guide talked all the way to Badagry.","antonym":"reticent","jamb":{"year":2012,"number":41}},{"id":"ant-2012-42-volatile","deck":"antonyms","front":"volatile","meaning":"Liable to change suddenly or become tense.","example":"The situation at the market became volatile after the argument.","antonym":"calm","jamb":{"year":2012,"number":42}},{"id":"ant-2012-42-calm","deck":"antonyms","front":"calm","meaning":"Free from disturbance, anger or excitement.","example":"The motor park was calm after the meeting.","antonym":"volatile","jamb":{"year":2012,"number":42}},{"id":"ant-2012-45-infinitesimal","deck":"antonyms","front":"infinitesimal","meaning":"Extremely small in amount or size.","example":"Only an infinitesimal amount of dye went into the sample.","antonym":"large","jamb":{"year":2012,"number":45}},{"id":"ant-2012-45-large","deck":"antonyms","front":"large","meaning":"Greater than usual in size or amount.","example":"The Kano stall received a large order for sandals.","antonym":"infinitesimal","jamb":{"year":2012,"number":45}},{"id":"ant-2012-48-callous","deck":"antonyms","front":"callous","meaning":"Showing no concern for another person's suffering.","example":"The callous reply upset the injured pupil.","antonym":"compassionate","jamb":{"year":2012,"number":48}},{"id":"ant-2012-48-compassionate","deck":"antonyms","front":"compassionate","meaning":"Caring about someone who is in distress.","example":"A compassionate nurse stayed with the frightened child in Aba.","antonym":"callous","jamb":{"year":2012,"number":48}},{"id":"ant-2016-49-curt","deck":"antonyms","front":"curt","meaning":"So brief that it sounds rude.","example":"A curt reply ended the discussion at assembly.","antonym":"polite","jamb":{"year":2016,"number":49}},{"id":"ant-2016-49-polite","deck":"antonyms","front":"polite","meaning":"Showing good manners toward other people.","example":"The polite passenger thanked the danfo driver.","antonym":"curt","jamb":{"year":2016,"number":49}},{"id":"ant-2013-48-frosty","deck":"antonyms","front":"frosty","meaning":"Cold or unfriendly in manner.","example":"The buyer gave the trader a frosty greeting.","antonym":"cordial","jamb":{"year":2013,"number":48}},{"id":"ant-2013-48-cordial","deck":"antonyms","front":"cordial","meaning":"Warm and friendly in manner.","example":"The new prefect gave us a cordial welcome.","antonym":"frosty","jamb":{"year":2013,"number":48}},{"id":"ant-2013-49-heinous","deck":"antonyms","front":"heinous","meaning":"Shockingly evil or cruel.","example":"The radio report described a heinous crime in the state.","antonym":"laudable","jamb":{"year":2013,"number":49}},{"id":"ant-2013-49-laudable","deck":"antonyms","front":"laudable","meaning":"Deserving praise or approval.","example":"The students made a laudable effort to restock the library.","antonym":"heinous","jamb":{"year":2013,"number":49}},{"id":"ant-2013-50-eventually","deck":"antonyms","front":"eventually","meaning":"After some delay or development.","example":"The danfo eventually reached Yaba.","antonym":"initially","jamb":{"year":2013,"number":50}},{"id":"ant-2013-50-initially","deck":"antonyms","front":"initially","meaning":"At the start of a situation.","example":"Initially, only three pupils signed up for the Kano club.","antonym":"eventually","jamb":{"year":2013,"number":50}},{"id":"ant-2013-51-plebs","deck":"antonyms","front":"plebs","meaning":"An insulting term for ordinary people as a group.","example":"The teacher warned that calling people plebs could offend them.","antonym":"elite","jamb":{"year":2013,"number":51}},{"id":"ant-2013-51-elite","deck":"antonyms","front":"elite","meaning":"A small group with more status or power than others.","example":"The speaker said the policy mainly helped the elite in Abuja.","antonym":"plebs","jamb":{"year":2013,"number":51}},{"id":"ant-2016-47-unpicked","deck":"antonyms","front":"unpicked","meaning":"Removed sewing stitches from something.","example":"The Aba tailor unpicked the hem to lengthen the skirt.","antonym":"sewed up","jamb":{"year":2016,"number":47}},{"id":"ant-2016-47-sewed-up","deck":"antonyms","front":"sewed up","meaning":"Closed an opening with stitches.","example":"The tailor sewed up the tear in Chidi's uniform.","antonym":"unpicked","jamb":{"year":2016,"number":47}},{"id":"ant-2016-48-antipathy","deck":"antonyms","front":"antipathy","meaning":"A deep or lasting dislike.","example":"Sade had an antipathy to loud chewing in class.","antonym":"affection","jamb":{"year":2016,"number":48}},{"id":"ant-2016-48-affection","deck":"antonyms","front":"affection","meaning":"A feeling of fondness or warmth.","example":"The pupils spoke with affection about their former teacher.","antonym":"antipathy","jamb":{"year":2016,"number":48}},{"id":"ant-2014-46-debilitated","deck":"antonyms","front":"debilitated","meaning":"Made weaker or less effective.","example":"A series of illnesses debilitated the team before the Kano final.","antonym":"invigorated","jamb":{"year":2014,"number":46}},{"id":"ant-2014-46-invigorated","deck":"antonyms","front":"invigorated","meaning":"Given renewed energy or strength.","example":"The new coach invigorated our team before the final.","antonym":"debilitated","jamb":{"year":2014,"number":46}},{"id":"ant-2016-53-erratic","deck":"antonyms","front":"erratic","meaning":"Changing without a regular pattern.","example":"Erratic power interrupted our evening lesson in Enugu.","antonym":"regular","jamb":{"year":2016,"number":53}},{"id":"ant-2016-53-regular","deck":"antonyms","front":"regular","meaning":"Recurring in a steady or expected pattern.","example":"The school held regular meetings throughout the term.","antonym":"erratic","jamb":{"year":2016,"number":53}},{"id":"ant-2016-54-vague","deck":"antonyms","front":"vague","meaning":"Too unclear or general to pin down.","example":"The note gave vague directions to the motor park.","antonym":"clear","jamb":{"year":2016,"number":54}},{"id":"ant-2016-54-clear","deck":"antonyms","front":"clear","meaning":"Easy to understand without guessing.","example":"Emeka gave clear directions to the new clinic.","antonym":"vague","jamb":{"year":2016,"number":54}},{"id":"ant-2016-55-communal","deck":"antonyms","front":"communal","meaning":"Shared by people in a group.","example":"The compound had a communal tap.","antonym":"private","jamb":{"year":2016,"number":55}},{"id":"ant-2016-55-private","deck":"antonyms","front":"private","meaning":"Reserved for one person or a particular group.","example":"The head teacher spoke with the pupil in a private room.","antonym":"communal","jamb":{"year":2016,"number":55}},{"id":"ant-2017-32-averred","deck":"antonyms","front":"averred","meaning":"Stated something firmly as true.","example":"The witness averred that she had been at the market.","antonym":"denied","jamb":{"year":2017,"number":32}},{"id":"ant-2017-32-denied","deck":"antonyms","front":"denied","meaning":"Said that a claim was untrue.","example":"The trader denied that he had charged a higher price.","antonym":"averred","jamb":{"year":2017,"number":32}},{"id":"ant-2017-34-indisposed","deck":"antonyms","front":"indisposed","meaning":"Slightly unwell or unable to attend because of illness.","example":"The assembly was led by another teacher because Mr Bello was indisposed.","antonym":"healthy","jamb":{"year":2017,"number":34}},{"id":"ant-2017-34-healthy","deck":"antonyms","front":"healthy","meaning":"In good physical condition.","example":"The nurse said the pupil looked healthy again.","antonym":"indisposed","jamb":{"year":2017,"number":34}},{"id":"ant-2018-35-prosperous","deck":"antonyms","front":"prosperous","meaning":"Doing well financially.","example":"The prosperous trader opened a second stall in Onitsha.","antonym":"unsuccessful","jamb":{"year":2018,"number":35}},{"id":"ant-2018-35-unsuccessful","deck":"antonyms","front":"unsuccessful","meaning":"Failing to get a hoped-for result.","example":"An unsuccessful sales campaign left the Aba shop with full shelves.","antonym":"prosperous","jamb":{"year":2018,"number":35}},{"id":"ant-2018-37-lightly","deck":"antonyms","front":"lightly","meaning":"Without treating something as important or serious.","example":"The coach told us not to take the league match lightly.","antonym":"seriously","jamb":{"year":2018,"number":37}},{"id":"ant-2018-37-seriously","deck":"antonyms","front":"seriously","meaning":"With real attention to importance or consequences.","example":"The head teacher took the safety complaint seriously.","antonym":"lightly","jamb":{"year":2018,"number":37}},{"id":"ant-2018-38-gentle","deck":"antonyms","front":"gentle","meaning":"Kind or careful in handling people or things.","example":"The nurse was gentle with the frightened child.","antonym":"harsh","jamb":{"year":2018,"number":38}},{"id":"ant-2018-38-harsh","deck":"antonyms","front":"harsh","meaning":"Severe or needlessly rough in manner.","example":"The harsh reply silenced the class at once.","antonym":"gentle","jamb":{"year":2018,"number":38}},{"id":"ant-2018-39-ignoble","deck":"antonyms","front":"ignoble","meaning":"Morally low or shameful.","example":"The head teacher called the cheating an ignoble act.","antonym":"honourable","jamb":{"year":2018,"number":39}},{"id":"ant-2018-39-honourable","deck":"antonyms","front":"honourable","meaning":"Morally right and worthy of respect.","example":"Returning the lost purse was an honourable act.","antonym":"ignoble","jamb":{"year":2018,"number":39}},{"id":"ant-2015-47-harrowing","deck":"antonyms","front":"harrowing","meaning":"Causing intense distress.","example":"It was a harrowing journey through the flooded streets of Lokoja.","antonym":"pleasant","jamb":{"year":2015,"number":47}},{"id":"ant-2015-47-pleasant","deck":"antonyms","front":"pleasant","meaning":"Giving enjoyment or a good feeling.","example":"We had a pleasant trip to the market in Nsukka.","antonym":"harrowing","jamb":{"year":2015,"number":47}},{"id":"ant-2015-52-scurries","deck":"antonyms","front":"scurries","meaning":"Moves in quick, short steps.","example":"The little dog scurries across the school yard when it rains.","antonym":"dawdles","jamb":{"year":2015,"number":52}},{"id":"ant-2015-52-dawdles","deck":"antonyms","front":"dawdles","meaning":"Moves slowly and wastes time.","example":"Ngozi dawdles on the way to the motor park.","antonym":"scurries","jamb":{"year":2015,"number":52}}]},"idioms":{"title":"Idioms and Sentence Interpretation","cards":[{"id":"idm-2010-26-with-a-jaundiced-eye","deck":"idioms","front":"with a jaundiced eye","meaning":"With distrust or a habit of expecting the worst.","example":"The board viewed another price rise with a jaundiced eye.","jamb":{"year":2010,"number":26}},{"id":"idm-2010-28-steer-a-middle-course","deck":"idioms","front":"steer a middle course","meaning":"Choose a position between two extremes.","example":"The PTA tried to steer a middle course on school fees.","jamb":{"year":2010,"number":28}},{"id":"idm-2010-30-with-their-tails-between-their-legs","deck":"idioms","front":"with their tails between their legs","meaning":"Showing shame after a defeat or mistake.","example":"Our team left the pitch with their tails between their legs.","jamb":{"year":2010,"number":30}},{"id":"idm-2010-32-crossed-the-rubicon","deck":"idioms","front":"crossed the Rubicon","meaning":"Taken a decisive step that cannot easily be reversed.","example":"When the cooperative signed the lease, it had crossed the Rubicon.","jamb":{"year":2010,"number":32}},{"id":"idm-2010-33-full-of-himself","deck":"idioms","front":"full of himself","meaning":"Too impressed by his own importance or abilities.","example":"The new captain sounded full of himself at assembly.","jamb":{"year":2010,"number":33}},{"id":"idm-2011-31-left-her-in-the-lurch","deck":"idioms","front":"left her in the lurch","meaning":"Stopped helping her when she still needed help.","example":"When Bisi's partner quit before the school debate, he left her in the lurch.","jamb":{"year":2011,"number":31}},{"id":"idm-2012-29-throwing-his-weight-about","deck":"idioms","front":"throwing his weight about","meaning":"Using his position or power to boss people around.","example":"The prefect was throwing his weight about in the canteen queue.","jamb":{"year":2012,"number":29}},{"id":"idm-2014-39-between-a-rock-and-a-hard-place","deck":"idioms","front":"between a rock and a hard place","meaning":"Facing two choices that both have serious drawbacks.","example":"With both suppliers raising prices, the trader was between a rock and a hard place.","jamb":{"year":2014,"number":39}},{"id":"idm-2010-31-talk-his-way-out-of","deck":"idioms","front":"talk his way out of","meaning":"Avoid a duty or get out of trouble by talking persuasively.","example":"Bola tried to talk his way out of tidying the classroom.","jamb":{"year":2010,"number":31}},{"id":"idm-2016-36-in-no-uncertain-terms","deck":"idioms","front":"in no uncertain terms","meaning":"In words that make a strong opinion completely clear.","example":"The principal rejected the proposal in no uncertain terms.","jamb":{"year":2016,"number":36}},{"id":"idm-2016-37-get-his-act-together","deck":"idioms","front":"get his act together","meaning":"Start organising himself well enough to succeed.","example":"Musa had to get his act together before the Kano debate.","jamb":{"year":2016,"number":37}},{"id":"idm-2016-38-keep-her-shirt-on","deck":"idioms","front":"keep her shirt on","meaning":"Stay calm and stop being impatient or angry.","example":"Tomi told her sister to keep her shirt on while they waited for a danfo.","jamb":{"year":2016,"number":38}},{"id":"idm-2016-42-live-in-each-other-s-pockets","deck":"idioms","front":"live in each other's pockets","meaning":"Spend nearly all one's time together.","example":"The twins live in each other's pockets at boarding school.","jamb":{"year":2016,"number":42}},{"id":"idm-2016-44-can-t-wait","deck":"idioms","front":"can't wait","meaning":"Feel very excited for something to happen soon.","example":"I can't wait to see the Eagles play in Uyo.","jamb":{"year":2016,"number":44}},{"id":"idm-2016-60-a-nose-for-stories","deck":"idioms","front":"a nose for stories","meaning":"A knack for spotting a good story.","example":"The school reporter has a nose for stories about local sports.","jamb":{"year":2016,"number":60}},{"id":"idm-2017-28-but-for-the-expense","deck":"idioms","front":"But for the expense","meaning":"If the cost were taken out of consideration.","example":"But for the expense, our class would travel to Abuja by air.","jamb":{"year":2017,"number":28}},{"id":"idm-2014-67-at-the-turn-of-the-century","deck":"idioms","front":"At the turn of the century","meaning":"Around the time one century ends and the next begins.","example":"The class read about life in Lagos at the turn of the century.","jamb":{"year":2014,"number":67}},{"id":"idm-2017-33-on-the-brink-of","deck":"idioms","front":"on the brink of","meaning":"Very close to a new or dangerous situation.","example":"The Abuja team was on the brink of elimination.","jamb":{"year":2017,"number":33}},{"id":"idm-2018-39-took-exception-to","deck":"idioms","front":"took exception to","meaning":"Objected to something because it seemed wrong or offensive.","example":"The prefect took exception to the joke made at assembly.","jamb":{"year":2018,"number":39}},{"id":"idm-2017-44-hands-are-tied","deck":"idioms","front":"hands are tied","meaning":"Cannot act because something prevents it.","example":"The prefect said her hands are tied until the head teacher returns.","jamb":{"year":2017,"number":44}},{"id":"idm-2018-27-let-the-sleeping-dog-lie","deck":"idioms","front":"let the sleeping dog lie","meaning":"Leave an old problem alone so it does not start up again.","example":"The prefect chose to let the sleeping dog lie after the quarrel ended.","jamb":{"year":2018,"number":27}},{"id":"idm-2018-29-make-both-ends-meet","deck":"idioms","front":"make both ends meet","meaning":"Have enough money to cover basic expenses.","example":"The Lagos trader took extra work to make both ends meet.","jamb":{"year":2018,"number":29}},{"id":"idm-2018-30-at-arm-s-length","deck":"idioms","front":"at arm's length","meaning":"At a distance that keeps someone from getting too close to you.","example":"After the quarrel, Ngozi kept her neighbour at arm's length.","jamb":{"year":2018,"number":30}},{"id":"idm-2018-31-a-chip-off-the-old-block","deck":"idioms","front":"a chip off the old block","meaning":"Someone whose character or habits strongly resemble a parent's.","example":"Aba traders say the young tailor is a chip off the old block.","jamb":{"year":2018,"number":31}},{"id":"idm-2018-32-play-to-the-gallery","deck":"idioms","front":"play to the gallery","meaning":"Try to win a crowd's approval through showy words or actions.","example":"The debate coach told Sade not to play to the gallery.","jamb":{"year":2018,"number":32}},{"id":"idm-2018-33-a-fool-s-paradise","deck":"idioms","front":"a fool's paradise","meaning":"A state of happiness based on false hopes.","example":"The side lived in a fool's paradise until the first league match.","jamb":{"year":2018,"number":33}},{"id":"idm-2014-36-a-drop-in-the-ocean","deck":"idioms","front":"a drop in the ocean","meaning":"A tiny amount compared with what is needed.","example":"One bag of cement was a drop in the ocean for the school repairs.","jamb":{"year":2014,"number":36}},{"id":"idm-2014-36-in-the-pipeline","deck":"idioms","front":"in the pipeline","meaning":"Being planned or prepared.","example":"A borehole is in the pipeline for the village school.","jamb":{"year":2014,"number":36}},{"id":"idm-2014-38-pigs-would-fly","deck":"idioms","front":"pigs would fly","meaning":"Something is so unlikely that it will probably never happen.","example":"Ada joked that pigs would fly before her brother washed the danfo.","jamb":{"year":2014,"number":38}},{"id":"idm-2014-48-taken-aback","deck":"idioms","front":"taken aback","meaning":"Suddenly surprised or unsettled.","example":"Ngozi was taken aback when they called her name at assembly.","jamb":{"year":2014,"number":48}},{"id":"idm-2014-41-a-bumpy-ride","deck":"idioms","front":"a bumpy ride","meaning":"A difficult time with a number of setbacks.","example":"The team had a bumpy ride through the city league.","jamb":{"year":2014,"number":41}},{"id":"idm-2014-43-take-my-eyes-off-the-ball","deck":"idioms","front":"take my eyes off the ball","meaning":"Stop paying attention to what matters most.","example":"I took my eyes off the ball and missed the final question in the school debate.","jamb":{"year":2014,"number":43}},{"id":"idm-2014-45-hand-to-mouth","deck":"idioms","front":"hand-to-mouth","meaning":"With only enough money or supplies for immediate needs.","example":"A loss of stock left the trader living hand-to-mouth.","jamb":{"year":2014,"number":45}},{"id":"idm-2015-44-lose-heart","deck":"idioms","front":"lose heart","meaning":"Stop believing you can succeed and feel discouraged.","example":"Do not lose heart if you miss a question in the mock exam.","jamb":{"year":2015,"number":44}},{"id":"idm-2012-33-feet-of-clay","deck":"idioms","front":"feet of clay","meaning":"A hidden weakness in a person who seems admirable.","example":"The captain showed feet of clay when he blamed a junior player for his mistake.","jamb":{"year":2012,"number":33}},{"id":"idm-2012-34-a-golden-opportunity","deck":"idioms","front":"a golden opportunity","meaning":"An unusually good chance to do something.","example":"The Lagos science fair was a golden opportunity to show our work.","jamb":{"year":2012,"number":34}},{"id":"idm-2012-51-a-taste-of-their-own-medicine","deck":"idioms","front":"a taste of their own medicine","meaning":"The same unpleasant treatment they gave to someone else.","example":"The boys got a taste of their own medicine when their classmates hid their football.","jamb":{"year":2012,"number":51}},{"id":"idm-2011-28-a-bird-s-eye-view","deck":"idioms","front":"a bird’s-eye view","meaning":"A view of a place from high above it.","example":"We had a bird’s-eye view of the market from the footbridge.","jamb":{"year":2011,"number":28}},{"id":"idm-2011-33-took-a-hit","deck":"idioms","front":"took a hit","meaning":"Suffered a setback, loss or damage.","example":"The Kano stall took a hit after the road closed.","jamb":{"year":2011,"number":33}},{"id":"idm-2012-35-at-the-most","deck":"idioms","front":"at the most","meaning":"No more than the amount named.","example":"The walk to the Enugu market takes ten minutes at the most.","jamb":{"year":2012,"number":35}}]},"phrasal-verbs-prepositions":{"title":"Phrasal Verbs and Prepositions","cards":[{"id":"phr-2010-67-rattles-off","deck":"phrasal-verbs-prepositions","front":"rattles off","meaning":"Says a list of things very quickly.","example":"The prefect rattles off the assembly notices without looking at his notes.","jamb":{"year":2010,"number":67}},{"id":"phr-2010-74-pleased-with","deck":"phrasal-verbs-prepositions","front":"pleased with","meaning":"Happy about a result, person or thing.","example":"The Aba tailor was pleased with the finished uniforms.","jamb":{"year":2010,"number":74}},{"id":"phr-2011-83-meddle-in","deck":"phrasal-verbs-prepositions","front":"meddle in","meaning":"Get involved in another person's affairs without invitation.","example":"Don't meddle in the matter between the two stall owners.","jamb":{"year":2011,"number":83}},{"id":"phr-2013-66-averse-to","deck":"phrasal-verbs-prepositions","front":"averse to","meaning":"Strongly against doing or accepting something.","example":"Bisi is averse to speaking at assembly without preparation.","jamb":{"year":2013,"number":66}},{"id":"phr-2014-73-testify-against","deck":"phrasal-verbs-prepositions","front":"testify against","meaning":"Give evidence in court that may harm someone's case.","example":"The trader agreed to testify against the man accused of theft.","jamb":{"year":2014,"number":73}},{"id":"phr-2015-66-increased-from-to","deck":"phrasal-verbs-prepositions","front":"increased from … to","meaning":"Went up from one amount to a higher one.","example":"The fare increased from two hundred naira to three hundred naira.","jamb":{"year":2015,"number":66}},{"id":"phr-2016-41-brush-up-on","deck":"phrasal-verbs-prepositions","front":"brush up on","meaning":"Practise an old skill to bring it back up to standard.","example":"Sade brushed up on her French before the school exchange.","jamb":{"year":2016,"number":41}},{"id":"phr-2016-45-pass-for","deck":"phrasal-verbs-prepositions","front":"pass for","meaning":"Be taken for someone or something else.","example":"In that uniform, Chidi could pass for a prefect.","jamb":{"year":2016,"number":45}},{"id":"phr-2016-76-made-up-of","deck":"phrasal-verbs-prepositions","front":"made up of","meaning":"Formed from several parts or members.","example":"The Enugu school team is made up of pupils from four classes.","jamb":{"year":2016,"number":76}},{"id":"phr-2016-78-recognised-by","deck":"phrasal-verbs-prepositions","front":"recognised by","meaning":"Identified through a particular feature or sign.","example":"At the park, Musa was recognised by his bright green cap.","jamb":{"year":2016,"number":78}},{"id":"phr-2017-42-came-across","deck":"phrasal-verbs-prepositions","front":"came across","meaning":"Met or found by chance.","example":"I came across my old teacher at the market in Aba.","jamb":{"year":2017,"number":42}},{"id":"phr-2017-43-turn-up","deck":"phrasal-verbs-prepositions","front":"turn up","meaning":"Arrive or appear.","example":"We waited for the driver to turn up at the motor park.","jamb":{"year":2017,"number":43}},{"id":"phr-2017-47-stand-by","deck":"phrasal-verbs-prepositions","front":"stand by","meaning":"Stay loyal to someone and support them.","example":"The class agreed to stand by its captain after the defeat.","jamb":{"year":2017,"number":47}},{"id":"phr-2013-75-carry-out","deck":"phrasal-verbs-prepositions","front":"carry out","meaning":"Do or complete a planned task.","example":"The science class will carry out a water test at the borehole.","jamb":{"year":2013,"number":75}},{"id":"phr-2014-82-verdict-on","deck":"phrasal-verbs-prepositions","front":"verdict on","meaning":"A decision or judgement about a matter.","example":"The organisers waited for the panel’s verdict on the school appeal.","jamb":{"year":2014,"number":82}},{"id":"phr-2010-70-pull-through","deck":"phrasal-verbs-prepositions","front":"pull through","meaning":"Survive a serious illness or other danger.","example":"The nurse told the Kano pupils that their friend would pull through.","jamb":{"year":2010,"number":70}},{"id":"phr-2010-75-made-from","deck":"phrasal-verbs-prepositions","front":"made from","meaning":"Produced from material whose original form changes.","example":"The craft club's paper was made from old newspapers.","jamb":{"year":2010,"number":75}},{"id":"phr-2010-78-sent-into-exile","deck":"phrasal-verbs-prepositions","front":"sent into exile","meaning":"Forced to leave one's own country or home region.","example":"Our class read about a ruler who was sent into exile.","jamb":{"year":2010,"number":78}},{"id":"phr-2010-80-by-word-of-mouth","deck":"phrasal-verbs-prepositions","front":"by word of mouth","meaning":"Through people telling one another directly.","example":"News of the price change spread by word of mouth through the market.","jamb":{"year":2010,"number":80}},{"id":"phr-2010-84-no-alternative-but","deck":"phrasal-verbs-prepositions","front":"no alternative but","meaning":"No other practical choice except the stated action.","example":"We had no alternative but to walk from the motor park.","jamb":{"year":2010,"number":84}},{"id":"phr-2011-27-put-off","deck":"phrasal-verbs-prepositions","front":"put off","meaning":"Moved to a later time.","example":"The PTA meeting was put off until Friday.","jamb":{"year":2011,"number":27}},{"id":"phr-2011-75-in-furtherance-of","deck":"phrasal-verbs-prepositions","front":"in furtherance of","meaning":"With the aim of helping something to move forward.","example":"The PTA held a fundraiser in furtherance of its library project.","jamb":{"year":2011,"number":75}},{"id":"phr-2015-84-by-air","deck":"phrasal-verbs-prepositions","front":"by air","meaning":"Using a plane as transport.","example":"The team travelled from Kano to Lagos by air.","jamb":{"year":2015,"number":84}},{"id":"phr-2012-76-part-with","deck":"phrasal-verbs-prepositions","front":"part with","meaning":"Give up or let go of something you have.","example":"The trader did not want to part with her oldest sewing machine.","jamb":{"year":2012,"number":76}},{"id":"phr-2012-80-laid-off","deck":"phrasal-verbs-prepositions","front":"laid off","meaning":"Dismissed from a job because there was no work or money to keep the job.","example":"The factory laid off ten workers after it lost a large order.","jamb":{"year":2012,"number":80}},{"id":"phr-2013-68-devoted-himself-to","deck":"phrasal-verbs-prepositions","front":"devoted himself to","meaning":"Gave much of his time or effort to a cause.","example":"The retired teacher devoted himself to helping children read.","jamb":{"year":2013,"number":68}},{"id":"phr-2013-83-confused-about","deck":"phrasal-verbs-prepositions","front":"confused about","meaning":"Unsure how to understand something.","example":"Ada was confused about the new bus fare.","jamb":{"year":2013,"number":83}},{"id":"phr-2015-72-deals-in","deck":"phrasal-verbs-prepositions","front":"deals in","meaning":"Trades in a particular type of goods.","example":"Her shop in Onitsha deals in phone accessories.","jamb":{"year":2015,"number":72}},{"id":"phr-2015-74-tearing-down","deck":"phrasal-verbs-prepositions","front":"Tearing down","meaning":"Pulling a building or other structure apart.","example":"Tearing down the old shed gave our school more space.","jamb":{"year":2015,"number":74}},{"id":"phr-2015-83-stand-up-for","deck":"phrasal-verbs-prepositions","front":"stand up for","meaning":"Defend a person or principle that is being attacked.","example":"The prefect stood up for the younger pupils at assembly.","jamb":{"year":2015,"number":83}}]},"confusable-words":{"title":"Confusable Words","cards":[{"id":"con-2010-79-site","deck":"confusable-words","front":"site","meaning":"A place where something stands or is planned.","example":"The council chose a site for the new market.","jamb":{"year":2010,"number":79},"trap":"Use cite for quoting a source and sight for what you see."},{"id":"con-2010-79-cited","deck":"confusable-words","front":"cited","meaning":"Mentioned a source or example as evidence.","example":"Amina cited her textbook during the school debate.","jamb":{"year":2010,"number":79},"trap":"Cited means referred to as evidence. Sighted means spotted."},{"id":"con-2010-79-sited","deck":"confusable-words","front":"sited","meaning":"Placed somewhere for a purpose.","example":"The borehole was sited next to the village school.","jamb":{"year":2010,"number":79},"trap":"Sited describes location. Sighted describes seeing."},{"id":"con-2010-79-sighted","deck":"confusable-words","front":"sighted","meaning":"Saw or spotted something, often at a distance.","example":"The pupils sighted a canoe across the lagoon.","jamb":{"year":2010,"number":79},"trap":"Do not use cited when you mean saw."},{"id":"con-2010-82-prescribed","deck":"confusable-words","front":"prescribed","meaning":"Ordered or officially recommended something.","example":"The school nurse prescribed a rest after the long race.","jamb":{"year":2010,"number":82},"trap":"Prescribed means recommended or directed. Proscribed means banned."},{"id":"con-2010-82-proscribed","deck":"confusable-words","front":"proscribed","meaning":"Banned by an authority.","example":"The market union proscribed trading in the fire lane.","jamb":{"year":2010,"number":82},"trap":"Do not write prescribed when an authority forbids something."},{"id":"con-2010-82-postulated","deck":"confusable-words","front":"postulated","meaning":"Put forward an idea for reasoning or testing.","example":"The class postulated that the seeds needed more light.","jamb":{"year":2010,"number":82},"trap":"Postulated introduces a theory. Projected can give an estimate."},{"id":"con-2010-82-projected","deck":"confusable-words","front":"projected","meaning":"Estimated what might happen in the future.","example":"The trader projected higher costs for the trip to Onitsha.","jamb":{"year":2010,"number":82},"trap":"Projected is used for a forecast. Postulated is used for a proposed idea."},{"id":"con-2010-85-circumvent","deck":"confusable-words","front":"circumvent","meaning":"Find a way around a rule or obstacle.","example":"The prefect warned students not to circumvent the library rules.","jamb":{"year":2010,"number":85},"trap":"Circumvent is a verb. Circumspect is an adjective."},{"id":"con-2010-85-circumspect","deck":"confusable-words","front":"circumspect","meaning":"Careful about possible risks before acting.","example":"The market chair was circumspect when the new supplier asked for cash.","jamb":{"year":2010,"number":85},"trap":"Circumspect describes someone cautious. Circumvent means get around something."},{"id":"con-2011-40-compliments","deck":"confusable-words","front":"compliments","meaning":"Says something approving or kind to someone.","example":"Our teacher compliments pupils who read clearly at assembly.","jamb":{"year":2011,"number":40},"trap":"Compliment means praise. Complement means complete or go well with."},{"id":"con-2011-40-complements","deck":"confusable-words","front":"complements","meaning":"Goes well with something or makes it complete.","example":"The blue scarf complements Bisi's school uniform.","jamb":{"year":2011,"number":40},"trap":"Use complements for things that go together. Use compliments for praise."},{"id":"con-2011-72-scoured","deck":"confusable-words","front":"scoured","meaning":"Searched a place very thoroughly.","example":"Ada scoured the classroom for her missing pen.","jamb":{"year":2011,"number":72},"trap":"Scoured means searched or scrubbed. Scored can mean earned points."},{"id":"con-2011-72-scored","deck":"confusable-words","front":"scored","meaning":"Earned points in a game or test.","example":"Kemi scored twice for the Kano school team.","jamb":{"year":2011,"number":72},"trap":"Use scored for points and scoured for a thorough search."},{"id":"con-2011-72-scouted","deck":"confusable-words","front":"scouted","meaning":"Looked around for something, often to assess it.","example":"The coach scouted the school league for promising players.","jamb":{"year":2011,"number":72},"trap":"Scouted can mean searched for talent. Scoured stresses searching all over."},{"id":"con-2011-80-career","deck":"confusable-words","front":"career","meaning":"The working life or profession of a person.","example":"Amina hopes for a career in nursing in Sokoto.","jamb":{"year":2011,"number":80},"trap":"A career is work over time. A carrier holds, transports or spreads something."},{"id":"con-2011-80-carrier","deck":"confusable-words","front":"carrier","meaning":"A person or thing that carries others or objects.","example":"Musa tied the bag of rice to the bicycle carrier.","jamb":{"year":2011,"number":80},"trap":"Do not spell the object that holds a load like the word career."},{"id":"con-2011-81-size","deck":"confusable-words","front":"size","meaning":"How big or small something is.","example":"The Aba tailor checked the size of the uniform.","jamb":{"year":2011,"number":81},"trap":"Size concerns measurement. Seize means take quickly or firmly."},{"id":"con-2011-81-seize","deck":"confusable-words","front":"seize","meaning":"Grab hold of something or take a chance eagerly.","example":"Bola decided to seize the chance to speak at assembly.","jamb":{"year":2011,"number":81},"trap":"Seize means grab or take. Cease means stop."},{"id":"con-2011-81-cease","deck":"confusable-words","front":"cease","meaning":"Stop happening or stop doing something.","example":"The vendor waited for the rain to cease before reopening her stall.","jamb":{"year":2011,"number":81},"trap":"Cease ends an action. Seize involves taking hold."},{"id":"con-2013-74-coalition","deck":"confusable-words","front":"coalition","meaning":"An alliance of groups working towards an aim.","example":"A coalition of local unions presented the proposal in Abuja.","jamb":{"year":2013,"number":74},"trap":"Coalition means alliance. Collusion means secret cooperation to deceive."},{"id":"con-2013-74-collusion","deck":"confusable-words","front":"collusion","meaning":"Secret cooperation to cheat or deceive.","example":"The exam board investigated possible collusion between two candidates.","jamb":{"year":2013,"number":74},"trap":"A coalition can work openly. Collusion is secret and dishonest."},{"id":"con-2013-82-matricide","deck":"confusable-words","front":"matricide","meaning":"The killing of one's own mother.","example":"Our English teacher explained matricide during the literature lesson.","jamb":{"year":2013,"number":82},"trap":"Matricide is a killing. Matriarch describes a woman who leads a family or group."},{"id":"con-2013-82-patricide","deck":"confusable-words","front":"patricide","meaning":"The killing of one's own father.","example":"The novel discussed in the Abuja class describes an act of patricide.","jamb":{"year":2013,"number":82},"trap":"Patricide refers to a father. Matricide refers to a mother."},{"id":"con-2013-82-matriarch","deck":"confusable-words","front":"matriarch","meaning":"A woman who heads a family or group.","example":"The family consulted its matriarch before the gathering in Benin City.","jamb":{"year":2013,"number":82},"trap":"A matriarch is a leader. Matricide refers to killing one's mother."},{"id":"con-2015-67-leaf","deck":"confusable-words","front":"leaf","meaning":"A flat part of a plant that grows from a stem.","example":"A mango leaf fell on the school bench.","jamb":{"year":2015,"number":67},"trap":"Leaf names a plant part. Life is the state of being alive."},{"id":"con-2015-67-alive","deck":"confusable-words","front":"alive","meaning":"Living or still full of activity.","example":"The fish at the waterside market were still alive.","jamb":{"year":2015,"number":67},"trap":"Say an animal is alive or call it a live animal."},{"id":"con-2015-67-life","deck":"confusable-words","front":"life","meaning":"The state of being alive or the time a person lives.","example":"The Lagos exhibition showed village life a century ago.","jamb":{"year":2015,"number":67},"trap":"Life is a noun. Live can describe an animal or a broadcast."},{"id":"con-2015-67-live","deck":"confusable-words","front":"live","meaning":"Able to go off, when used of a bomb or ammunition.","example":"The radio warned that a live shell had been found near the field.","jamb":{"year":2015,"number":67},"trap":"In this sense, live comes before the noun. Alive describes a living thing."},{"id":"con-2017-49-conserve","deck":"confusable-words","front":"conserve","meaning":"Protect something by using it carefully.","example":"The Kano school asked pupils to conserve water during the dry season.","jamb":{"year":2017,"number":49},"trap":"Conserve means save a supply. Preserve can mean maintain something in its existing state.","check":true,"note":"The printed key points to conserve in an awkward sentence. The card uses the dictionary sense in a new context."}]},"spelling":{"title":"Spelling","cards":[{"id":"spl-2011-69-fortnight","deck":"spelling","front":"fortnight","meaning":"A period of two weeks.","example":"The school holidays lasted a fortnight.","jamb":{"year":2011,"number":69},"trap":"Writing fourthnight because the word sounds as if it begins with fourth.","rule":{"text":"Write fort before night.","right":"fortnight","wrong":"fourthnight"}},{"id":"spl-2011-74-eclectic","deck":"spelling","front":"eclectic","meaning":"Drawn from a wide range of styles or sources.","example":"Bola chose an eclectic mix of songs for the Abuja concert.","jamb":{"year":2011,"number":74},"trap":"Leaving out the second c.","rule":{"text":"The middle is lect, with a c before the t.","right":"eclectic","wrong":"ecletic"}},{"id":"spl-2011-76-pronunciation","deck":"spelling","front":"pronunciation","meaning":"The way a word is spoken.","example":"The class practised the pronunciation of words before assembly.","jamb":{"year":2011,"number":76},"trap":"Keeping the ou from pronounce.","rule":{"text":"The noun uses nun in the middle.","right":"pronunciation","wrong":"pronounciation"}},{"id":"spl-2012-69-auxiliary","deck":"spelling","front":"auxiliary","meaning":"Giving extra help or support.","example":"The auxiliary nurse helped at the village clinic.","jamb":{"year":2012,"number":69},"trap":"Writing double l or dropping the i after l.","rule":{"text":"Write aux-il-iary, with one l.","right":"auxiliary","wrong":"auxilliary"}},{"id":"spl-2012-72-foremost","deck":"spelling","front":"foremost","meaning":"Most important or first in rank.","example":"Safety was the foremost concern on the trip to Kano.","jamb":{"year":2012,"number":72},"trap":"Writing formost by dropping the first e.","rule":{"text":"Join fore and most.","right":"foremost","wrong":"formost"}},{"id":"spl-2012-78-veterinary","deck":"spelling","front":"veterinary","meaning":"Relating to medical care for animals.","example":"The farmer went to a veterinary clinic in Jos.","jamb":{"year":2012,"number":78},"trap":"Dropping a syllable in the middle.","rule":{"text":"Write veter before inary.","right":"veterinary","wrong":"vetinary"}},{"id":"spl-2012-78-unravelled","deck":"spelling","front":"unravelled","meaning":"Worked out the details of something complicated.","example":"The pupils unravelled the puzzle at the Abuja science fair.","jamb":{"year":2012,"number":78},"trap":"Using the US single-l past form in a British spelling exercise.","rule":{"text":"Double the final l before ed in British spelling.","right":"unravelled","wrong":"unraveled"}},{"id":"spl-2013-67-onomatopoeia","deck":"spelling","front":"onomatopoeia","meaning":"The use of words that imitate sounds.","example":"The teacher used buzz to explain onomatopoeia at our school.","jamb":{"year":2013,"number":67},"trap":"Putting ie where the spelling has ei.","rule":{"text":"End the word with poeia.","right":"onomatopoeia","wrong":"onomatopiea"},"check":true,"note":"The PDF text repeats onomatopoeia in two options. The card teaches the dictionary spelling only."},{"id":"spl-2016-81-fluorescent","deck":"spelling","front":"fluorescent","meaning":"Producing a bright glow, as in some lamps.","example":"A fluorescent tube lit the examination hall in Kano.","jamb":{"year":2016,"number":81},"trap":"Swapping the u and o.","rule":{"text":"Write fluor before escent.","right":"fluorescent","wrong":"flourescent"}},{"id":"spl-2016-84-argument","deck":"spelling","front":"argument","meaning":"A disagreement or a set of reasons for a point of view.","example":"An argument broke out over the fare at the bus park.","jamb":{"year":2016,"number":84},"trap":"Keeping the e from argue before ment.","rule":{"text":"Drop the final e in argue before adding ment.","right":"argument","wrong":"arguement"}},{"id":"spl-2017-58-irrevocable","deck":"spelling","front":"irrevocable","meaning":"Impossible to reverse or take back.","example":"The lawyer told Amina the agreement was irrevocable.","jamb":{"year":2017,"number":58},"trap":"Dropping the second r.","rule":{"text":"Join ir and revocable to get a double r.","right":"irrevocable","wrong":"irevocable"},"check":true,"note":"The PDF key indicates a different stressed syllable from Cambridge. The card teaches spelling only."},{"id":"spl-2018-58-comfortable","deck":"spelling","front":"comfortable","meaning":"Making someone feel physically at ease.","example":"The new seats in the Abuja bus were comfortable.","jamb":{"year":2018,"number":58},"trap":"Leaving out the t heard weakly in speech.","rule":{"text":"Keep the whole word comfort before able.","right":"comfortable","wrong":"comforable"}},{"id":"spl-2018-59-incapacitate","deck":"spelling","front":"incapacitate","meaning":"Make someone unable to work or act normally.","example":"The doctor said a bad sprain could incapacitate a runner.","jamb":{"year":2018,"number":59},"trap":"Using s where the word has its second c.","rule":{"text":"Keep capac in the middle before itate.","right":"incapacitate","wrong":"incapasitate"}},{"id":"spl-2018-60-encouragement","deck":"spelling","front":"encouragement","meaning":"Words or actions that give someone confidence.","example":"The Kano pupils welcomed the coach's encouragement.","jamb":{"year":2018,"number":60},"trap":"Dropping the e from encourage.","rule":{"text":"Keep the final e of encourage before adding ment.","right":"encouragement","wrong":"encouragment"}},{"id":"spl-accommodation","deck":"spelling","front":"accommodation","meaning":"A place to stay or live.","example":"The club found accommodation for the Abuja tournament.","trap":"Writing only one c or one m.","rule":{"text":"Use both cc and mm.","right":"accommodation","wrong":"accomodation"}},{"id":"spl-address","deck":"spelling","front":"address","meaning":"The details of where someone lives or works.","example":"Emeka wrote his address on the school form.","trap":"Writing only one d.","rule":{"text":"Double the d and the final s.","right":"address","wrong":"adress"}},{"id":"spl-beginning","deck":"spelling","front":"beginning","meaning":"The first part or start of something.","example":"We sang at the beginning of assembly.","trap":"Writing one n before ing.","rule":{"text":"Double the final n of begin before adding ing.","right":"beginning","wrong":"begining"}},{"id":"spl-believe","deck":"spelling","front":"believe","meaning":"Think something is true.","example":"I believe the market opens before eight.","trap":"Reversing the i and e.","rule":{"text":"The last four letters are ieve.","right":"believe","wrong":"beleive"}},{"id":"spl-business","deck":"spelling","front":"business","meaning":"Work involving trade, or a company doing that work.","example":"Her catering business supplies a school in Kano.","trap":"Spelling it like its short first spoken syllable.","rule":{"text":"Write busi, then ness.","right":"business","wrong":"buisness"}},{"id":"spl-committee","deck":"spelling","front":"committee","meaning":"A group appointed to handle particular work.","example":"The school committee met before assembly.","trap":"Leaving out one t.","rule":{"text":"Double the m, t and final e.","right":"committee","wrong":"commitee"}},{"id":"spl-environment","deck":"spelling","front":"environment","meaning":"The surroundings or conditions in which something lives.","example":"The Abuja club cleaned the environment around its school.","trap":"Dropping the n before ment.","rule":{"text":"Keep both n's in environ before ment.","right":"environment","wrong":"enviroment"}},{"id":"spl-opportunity","deck":"spelling","front":"opportunity","meaning":"A chance to do something.","example":"The school fair gave Ada an opportunity to sell her baskets.","trap":"Writing only one p.","rule":{"text":"Double the p after the opening o.","right":"opportunity","wrong":"oportunity"}},{"id":"spl-receive","deck":"spelling","front":"receive","meaning":"Get something given or sent to you.","example":"The pupils will receive their books at assembly.","trap":"Putting i before e in the ending.","rule":{"text":"Write e before i after c in receive.","right":"receive","wrong":"recieve"}},{"id":"spl-recommend","deck":"spelling","front":"recommend","meaning":"Suggest that someone choose or do something.","example":"The librarian will recommend a book for the class.","trap":"Using one m or two c's.","rule":{"text":"Use one c and two m's.","right":"recommend","wrong":"recomend"}},{"id":"spl-restaurant","deck":"spelling","front":"restaurant","meaning":"A place where people pay for a prepared meal.","example":"We stopped at a restaurant in Ibadan after the match.","trap":"Dropping the u after a.","rule":{"text":"Write restau before rant.","right":"restaurant","wrong":"restarant"}},{"id":"spl-advertisement","deck":"spelling","front":"advertisement","meaning":"A public message that promotes something.","example":"Bisi saw an advertisement for the used bicycle in Aba.","trap":"Dropping the e in the ending.","rule":{"text":"Keep the e in advertise before adding ment.","right":"advertisement","wrong":"advertisment"}},{"id":"spl-although","deck":"spelling","front":"although","meaning":"Introduces a fact that contrasts with the rest of a sentence.","example":"Although it rained, the Kano team played the match.","trap":"Giving it two l's or a final t.","rule":{"text":"Write al plus though.","right":"although","wrong":"allthought"}},{"id":"spl-always","deck":"spelling","front":"always","meaning":"At all times or on every occasion.","example":"The bus driver always greets the pupils at the gate.","trap":"Adding a second l at the start.","rule":{"text":"Write al plus ways, with one l.","right":"always","wrong":"allways"}},{"id":"spl-appreciate","deck":"spelling","front":"appreciate","meaning":"Feel grateful for something or recognise its value.","example":"The teachers appreciate the help from the PTA.","trap":"Dropping one p.","rule":{"text":"Begin with app, using two p's.","right":"appreciate","wrong":"apreciate"}},{"id":"spl-available","deck":"spelling","front":"available","meaning":"Ready to be used or obtained.","example":"Three seats were available on the bus to Enugu.","trap":"Putting the i before the l.","rule":{"text":"Write avail before able.","right":"available","wrong":"avaliable"}},{"id":"spl-beautiful","deck":"spelling","front":"beautiful","meaning":"Very pleasing in appearance or sound.","example":"The class admired a beautiful mural in Abuja.","trap":"Writing double l or shortening the vowel group.","rule":{"text":"Keep eau near the start and use one final l.","right":"beautiful","wrong":"beatifull"}},{"id":"spl-because","deck":"spelling","front":"because","meaning":"Gives the reason something happened.","example":"Our assembly moved indoors because rain was coming.","trap":"Writing ou in the second half of the word.","rule":{"text":"Write be followed by cause.","right":"because","wrong":"becouse"}},{"id":"spl-bicycle","deck":"spelling","front":"bicycle","meaning":"A vehicle with two wheels that you move by pedalling.","example":"Musa rode his bicycle to the village market.","trap":"Replacing the y with i.","rule":{"text":"Keep cycle after bi.","right":"bicycle","wrong":"bicicle"}},{"id":"spl-colleague","deck":"spelling","front":"colleague","meaning":"Someone you work with.","example":"My aunt and her colleague teach at a school in Jos.","trap":"Dropping the a from league.","rule":{"text":"Write col plus league.","right":"colleague","wrong":"collegue"}},{"id":"spl-convenient","deck":"spelling","front":"convenient","meaning":"Easy to fit into one's plans or needs.","example":"The new bus stop is convenient for pupils in Yaba.","trap":"Putting an i before the n in the middle.","rule":{"text":"Write ven in the middle of convenient.","right":"convenient","wrong":"convinient"}},{"id":"spl-customer","deck":"spelling","front":"customer","meaning":"Someone who buys goods or pays for a service.","example":"The trader helped a customer choose a school bag.","trap":"Writing costumer for a buyer.","rule":{"text":"Keep the word custom before er.","right":"customer","wrong":"costumer"}},{"id":"spl-decide","deck":"spelling","front":"decide","meaning":"Choose what to do or settle a question.","example":"The class will decide where to hold the party.","trap":"Writing the first vowel as i.","rule":{"text":"Start with de followed by cide.","right":"decide","wrong":"dicide"}},{"id":"spl-definitely","deck":"spelling","front":"definitely","meaning":"With certainty or without doubt.","example":"Ada will definitely arrive before assembly.","trap":"Putting an a in the middle.","rule":{"text":"Keep definite when adding ly.","right":"definitely","wrong":"definately"}},{"id":"spl-different","deck":"spelling","front":"different","meaning":"Unlike something else or distinct from it.","example":"The Aba market has different stalls for shoes and fabrics.","trap":"Dropping a letter from the double f.","rule":{"text":"Write two f's before erent.","right":"different","wrong":"diferent"}},{"id":"spl-disappointed","deck":"spelling","front":"disappointed","meaning":"Unhappy because things did not go as hoped.","example":"The Kano team was disappointed by the result.","trap":"Doubling the s in place of the p.","rule":{"text":"Join dis and appointed, with one s and two p's.","right":"disappointed","wrong":"dissapointed"}},{"id":"spl-embarrassing","deck":"spelling","front":"embarrassing","meaning":"Likely to make someone feel awkward or ashamed.","example":"It was embarrassing to call the teacher by the wrong name at assembly.","trap":"Dropping one s or one r.","rule":{"text":"Keep both r's and both s's from embarrass before adding ing.","right":"embarrassing","wrong":"embarrasing"}},{"id":"spl-especially","deck":"spelling","front":"especially","meaning":"More than usual or more than others in the group.","example":"The market is busy, especially on Fridays.","trap":"Writing ex at the start.","rule":{"text":"Write e before special and add ly.","right":"especially","wrong":"expecially"}},{"id":"spl-excellent","deck":"spelling","front":"excellent","meaning":"Of very high quality.","example":"Amina did an excellent job at the Enugu science fair.","trap":"Dropping an l.","rule":{"text":"Keep the c after ex and write two l's.","right":"excellent","wrong":"excelent"}},{"id":"spl-exercise","deck":"spelling","front":"exercise","meaning":"Activity done for health or for practice.","example":"The teacher gave us an exercise on fractions.","trap":"Writing an extra c near the beginning.","rule":{"text":"Begin with exe and end with rcise.","right":"exercise","wrong":"excersise"}},{"id":"spl-forward","deck":"spelling","front":"forward","meaning":"Towards the front.","example":"The driver asked the passengers to move forward in the danfo.","trap":"Dropping the r before w.","rule":{"text":"Write for plus ward.","right":"forward","wrong":"foward"}},{"id":"spl-friend","deck":"spelling","front":"friend","meaning":"Someone you know well and like.","example":"Chidi met his friend at the school gate.","trap":"Writing ei in the middle.","rule":{"text":"Put i before e in friend.","right":"friend","wrong":"freind"}},{"id":"spl-grateful","deck":"spelling","front":"grateful","meaning":"Thankful for help or kindness.","example":"The club was grateful for the books donated to the library.","trap":"Writing great at the start.","rule":{"text":"Write grate before ful, with one final l.","right":"grateful","wrong":"greatful"}},{"id":"spl-nowadays","deck":"spelling","front":"nowadays","meaning":"At the present time, often compared with the past.","example":"Nowadays, our school sends notices by text.","trap":"Dropping the a after now.","rule":{"text":"Put an a between now and days.","right":"nowadays","wrong":"nowdays"}},{"id":"spl-successful","deck":"spelling","front":"successful","meaning":"Having achieved what was planned.","example":"The fundraiser for the clinic was successful.","trap":"Doubling the final l or dropping a middle consonant.","rule":{"text":"Keep both c's and both s's in success, then add ful.","right":"successful","wrong":"succesfull"}},{"id":"spl-whether","deck":"spelling","front":"whether","meaning":"Introduces two possibilities or an indirect yes/no question.","example":"The pupils asked whether assembly would be indoors.","trap":"Dropping the h when writing the conjunction.","rule":{"text":"Start with wh, with the second h in the th pair.","right":"whether","wrong":"wether"}}]},"grammar-rules":{"title":"Grammar Rules","cards":[{"id":"grm-2010-66","deck":"grammar-rules","front":"Word order · not only … but also","meaning":"The pair gives extra emphasis to two related points.","example":"Ladi is gifted not only in music but also in maths.","jamb":{"year":2010,"number":66},"trap":"Placing only not before the first point.","rule":{"text":"Put not only before the first parallel part and but also before the second.","right":"Ladi sings not only at school but also at church.","wrong":"Ladi sings only not at school but also at church."}},{"id":"grm-2010-69","deck":"grammar-rules","front":"Reported speech · yes/no questions","meaning":"An indirect yes/no question starts with a linking word.","example":"The teacher asked if we had seen the notice.","jamb":{"year":2010,"number":69},"trap":"Leaving the question in direct form after asked.","rule":{"text":"Use if or whether and put the subject before the verb.","right":"The driver asked if I had paid.","wrong":"The driver asked did I pay."}},{"id":"grm-2010-73","deck":"grammar-rules","front":"Word order · comparative adjective phrases","meaning":"More can change the degree of the adjective that comes next.","example":"The market needs more reliable evening transport.","jamb":{"year":2010,"number":73},"trap":"Separating more from the adjective it modifies.","rule":{"text":"Keep more next to the adjective it modifies.","right":"The market needs more reliable evening transport.","wrong":"The market needs reliable more evening transport."}},{"id":"grm-2010-77","deck":"grammar-rules","front":"Possessives · plural ending in s","meaning":"A final apostrophe can show that several people own something.","example":"The prefect collected the girls' bags before assembly.","jamb":{"year":2010,"number":77},"trap":"Adding another s after an already plural ending.","rule":{"text":"For a regular plural ending in s, add an apostrophe after that s.","right":"The girls' bags were in the hall.","wrong":"The girls's bags were in the hall."}},{"id":"grm-2010-80","deck":"grammar-rules","front":"Concord · information","meaning":"Information names material that English usually treats as an amount.","example":"The school sends information by text message.","jamb":{"year":2010,"number":80},"trap":"Adding a plural s to information.","rule":{"text":"Use singular verb agreement with information and count pieces of it if needed.","right":"The information is on the noticeboard.","wrong":"The informations are on the noticeboard."}},{"id":"grm-2010-81","deck":"grammar-rules","front":"Concord · one of + plural noun","meaning":"One person or thing is selected from a larger group.","example":"Ada is one of the fastest runners in Kano.","jamb":{"year":2010,"number":81},"trap":"Putting a singular noun after one of.","rule":{"text":"Use a plural noun for the group after one of.","right":"Ada is one of the school runners.","wrong":"Ada is one of the school runner."}},{"id":"grm-2011-66","deck":"grammar-rules","front":"Tense · irregular past of burst","meaning":"Some verbs keep the same form in the simple past.","example":"The danfo tyre burst near the market.","jamb":{"year":2011,"number":66},"trap":"Adding ed to burst.","rule":{"text":"Use burst for the simple past of burst.","right":"The balloon burst at assembly.","wrong":"The balloon bursted at assembly."}},{"id":"grm-2011-67","deck":"grammar-rules","front":"Tense · used to for a past habit","meaning":"Used to describes a repeated action that no longer happens.","example":"Musa used to walk to school before he moved.","jamb":{"year":2011,"number":67},"trap":"Dropping the d in a positive sentence.","rule":{"text":"Use used to plus the base verb in positive statements about past habits.","right":"We used to walk to school.","wrong":"We use to walk to school."}},{"id":"grm-2011-73","deck":"grammar-rules","front":"Reported speech · wh-questions","meaning":"In a reported wh-question, the words after the question word follow statement order.","example":"Ada asked where the clinic was.","jamb":{"year":2011,"number":73},"trap":"Putting the verb before the subject in the reported clause.","rule":{"text":"After the wh-word, put the subject before the verb.","right":"Ada asked where the clinic was.","wrong":"Ada asked where was the clinic."}},{"id":"grm-2012-76","deck":"grammar-rules","front":"Word order · colour and material","meaning":"Adjectives that describe material sit close to the noun.","example":"The stall sold black leather belts.","jamb":{"year":2012,"number":76},"trap":"Putting the material before the colour.","rule":{"text":"When both adjectives precede a noun, colour normally comes before material.","right":"The stall sold black leather belts.","wrong":"The stall sold leather black belts."}},{"id":"grm-2012-77","deck":"grammar-rules","front":"Concord · past simple question tags","meaning":"A tag for a positive simple-past clause usually checks agreement with didn't.","example":"The pupils left at noon, didn't they?","jamb":{"year":2012,"number":77},"trap":"Using isn't it as a tag for a past action.","rule":{"text":"Use didn't plus the matching subject pronoun after a positive simple-past clause with an ordinary verb.","right":"The pupils left at noon, didn't they?","wrong":"The pupils left at noon, isn't it?"}},{"id":"grm-2012-85","deck":"grammar-rules","front":"Reported speech · backshift of are","meaning":"A present form can move back into the past when the reporting verb is past.","example":"Amina asked what the assembly rules were.","jamb":{"year":2012,"number":85},"trap":"Keeping are in an indirect question about rules that no longer apply.","rule":{"text":"Use were when backshifting are in past reporting.","right":"Amina asked what the former rules were.","wrong":"Amina asked what the former rules are."}},{"id":"grm-2013-77","deck":"grammar-rules","front":"Pronouns · theirs","meaning":"Theirs stands on its own in place of a noun phrase showing ownership.","example":"Our stall is near the road and theirs is by the gate.","jamb":{"year":2013,"number":77},"trap":"Writing their's as if it needed an apostrophe.","rule":{"text":"Write the independent possessive pronoun theirs with no apostrophe.","right":"The smaller stall is theirs.","wrong":"The smaller stall is their's."}},{"id":"grm-2013-79","deck":"grammar-rules","front":"Word order · neither in short replies","meaning":"Neither can show that a negative statement also applies to you.","example":"“I haven't paid the fare.” “Neither have I.”","jamb":{"year":2013,"number":79},"trap":"Keeping normal subject–verb order after neither in a short reply.","rule":{"text":"Use neither plus the matching auxiliary and then the subject.","right":"“I haven't paid the fare.” “Neither have I.”","wrong":"“I haven't paid the fare.” “Neither I have.”"}},{"id":"grm-2013-80","deck":"grammar-rules","front":"Tense · third conditional","meaning":"This pattern imagines a different past result.","example":"If Chidi had trained harder, he would have won in Enugu.","jamb":{"year":2013,"number":80},"trap":"Using simple past alone for the if-clause about an unreal past.","rule":{"text":"Use if plus had and a past participle, then would have plus a past participle in the result.","right":"If Chidi had trained harder, he would have won.","wrong":"If Chidi trained harder, he would have won."}},{"id":"grm-2013-81","deck":"grammar-rules","front":"Pronouns · whoever as subject","meaning":"Whoever can mean any person who does something.","example":"Give the ticket to whoever asks for it first at the park.","jamb":{"year":2013,"number":81},"trap":"Choosing whomever because of the previous preposition when the pronoun begins a clause as its subject.","rule":{"text":"Use whoever as the subject of its own clause.","right":"Give the ticket to whoever asks first.","wrong":"Give the ticket to whomever asks first."}},{"id":"grm-2014-71","deck":"grammar-rules","front":"Tense · past perfect continuous","meaning":"This form looks back at an ongoing action from another past point.","example":"The team had been training for an hour when the rain started.","jamb":{"year":2014,"number":71},"trap":"Using has been with a past reference point.","rule":{"text":"Use had been and the -ing form for a continuing action before a point in the past.","right":"They had been training when the rain started.","wrong":"They has been training when the rain started."}},{"id":"grm-2014-75","deck":"grammar-rules","front":"Concord · plural have been","meaning":"Have agrees with plural subjects in this present-perfect pattern.","example":"The uniforms have been washed for assembly.","jamb":{"year":2014,"number":75},"trap":"Using has with a plural subject.","rule":{"text":"Use have been, followed by the past participle, with plural subjects in this present-perfect passive.","right":"The uniforms have been washed.","wrong":"The uniforms has been washed."}},{"id":"grm-2014-81","deck":"grammar-rules","front":"Tense · a finished time with ago","meaning":"Ago places a completed event a given distance back from now.","example":"The Kano bus left two hours ago.","jamb":{"year":2014,"number":81},"trap":"Using the present perfect with a finished time introduced by ago.","rule":{"text":"Use the simple past for a completed event dated with ago.","right":"The Kano bus left two hours ago.","wrong":"The Kano bus has left two hours ago."}},{"id":"grm-2015-68","deck":"grammar-rules","front":"Concord · plural were","meaning":"Were is the ordinary past form of be with a plural subject.","example":"The mechanic said the danfo brakes were worn.","jamb":{"year":2015,"number":68},"trap":"Using was for plural subjects such as brakes.","rule":{"text":"Use were with an ordinary plural subject in the past tense.","right":"The brakes were worn.","wrong":"The brakes was worn."}},{"id":"grm-2015-70","deck":"grammar-rules","front":"Word order · inverted past conditional","meaning":"Had can begin a formal conditional clause in place of if.","example":"Had Ada left earlier, she would have caught the bus to Jos.","jamb":{"year":2015,"number":70},"trap":"Keeping the subject before had after dropping if.","rule":{"text":"When if is omitted in this construction, put had before the subject.","right":"Had Ada left earlier, she would have caught the bus.","wrong":"Ada had left earlier, she would have caught the bus."}},{"id":"grm-2015-79","deck":"grammar-rules","front":"Concord · question tags with be","meaning":"A tag after a positive was clause usually has a negative form of be.","example":"Bola was at assembly, wasn't she?","jamb":{"year":2015,"number":79},"trap":"Using didn't in a tag when the main verb is was.","rule":{"text":"Copy the form of be and switch a positive clause to a negative tag.","right":"Bola was at assembly, wasn't she?","wrong":"Bola was at assembly, didn't she?"}},{"id":"grm-2015-82","deck":"grammar-rules","front":"Concord · tags after negatives","meaning":"A negative statement normally takes a positive tag.","example":"Amina doesn't trade on Sundays, does she?","jamb":{"year":2015,"number":82},"trap":"Repeating the negative in the tag of a neutral confirmation question.","rule":{"text":"After doesn't, use the positive tag does plus the subject pronoun.","right":"Amina doesn't trade on Sundays, does she?","wrong":"Amina doesn't trade on Sundays, doesn't she?"}},{"id":"grm-2016-67","deck":"grammar-rules","front":"Concord · uncountable materials","meaning":"Material names such as sand and cement usually refer to quantities.","example":"The builder mixed sand and cement behind the classroom.","jamb":{"year":2016,"number":67},"trap":"Putting a directly before an uncountable material noun.","rule":{"text":"Use a measure such as a bag of when counting a material like cement.","right":"The workers bought cement.","wrong":"The workers bought a cement."}},{"id":"grm-2016-68","deck":"grammar-rules","front":"Tense · past perfect for the earlier event","meaning":"The past perfect can make it clear which of two past events came first.","example":"Before the lesson, Tayo had believed all seeds grew at the same speed.","jamb":{"year":2016,"number":68},"trap":"Using a present form for a belief that changed before now.","rule":{"text":"To mark an earlier state against a past reference, use had plus the past participle.","right":"Before the lesson, Tayo had believed that rumour.","wrong":"Before the lesson yesterday, Tayo has believed that rumour."}},{"id":"grm-2016-72","deck":"grammar-rules","front":"Tense · for and since","meaning":"For introduces a duration and since introduces a starting point.","example":"The pupils have been waiting at the bus park for ten minutes.","jamb":{"year":2016,"number":72},"trap":"Using since before a length of time.","rule":{"text":"Use for with an amount of time and since with a starting date or time.","right":"The pupils have waited for ten minutes.","wrong":"The pupils have waited since ten minutes."}},{"id":"grm-2016-77","deck":"grammar-rules","front":"Pronouns and determiners · any after a negative","meaning":"Any can express an unrestricted amount after a negative verb.","example":"The treasurer didn't have any change for the bus fare.","jamb":{"year":2016,"number":77},"trap":"Adding a second negative with no in standard classroom English.","rule":{"text":"Use any after a negative verb to express a single negative.","right":"I didn't have any change.","wrong":"I didn't have no change."}},{"id":"grm-2016-82","deck":"grammar-rules","front":"Concord · subject with a contrasting phrase","meaning":"A phrase giving a contrast does not replace the actual subject.","example":"The coach, not the players, was responsible for the school kit.","jamb":{"year":2016,"number":82},"trap":"Making the verb agree with the nearby plural noun players.","rule":{"text":"Match the verb to the main subject, ignoring a separate not phrase.","right":"The coach, not the players, was responsible.","wrong":"The coach, not the players, were responsible."}},{"id":"grm-2018-48","deck":"grammar-rules","front":"Concord · tags with ought to","meaning":"In British English, a positive ought to clause can take an oughtn’t tag.","example":"We ought to thank the referee, oughtn’t we?","jamb":{"year":2018,"number":48},"trap":"Using a tag with an unrelated form such as isn’t it.","rule":{"text":"When repeating ought in the tag, use oughtn’t plus the subject pronoun.","right":"We ought to thank the referee, oughtn’t we?","wrong":"We ought to thank the referee, isn’t it?"}},{"id":"grm-2018-47","deck":"grammar-rules","front":"Concord · one person with two titles","meaning":"Two titles can refer to the same person and take a singular verb.","example":"The club's coach and treasurer is Amina.","jamb":{"year":2018,"number":47},"trap":"Making the verb plural even though both titles belong to one person.","rule":{"text":"When two titles name a single person, use a singular verb.","right":"Amina, our coach and treasurer, is here.","wrong":"Amina, our coach and treasurer, are here."}}]}}</script>
  <script>
    const decks = JSON.parse(document.getElementById('deck-data').textContent)
    const select = document.getElementById('deck')
    const flagged = document.getElementById('flagged')
    const count = document.getElementById('count')
    const container = document.getElementById('cards')

    for (const [id, { title, cards }] of Object.entries(decks)) {
      select.add(new Option(title + ' · ' + cards.length, id))
    }

    function element(tag, value, className) {
      const node = document.createElement(tag)
      node.textContent = value
      if (className) node.className = className
      return node
    }

    function render() {
      const visibleDecks = select.value ? [decks[select.value]] : Object.values(decks)
      const content = document.createDocumentFragment()
      let visible = 0
      for (const { title, cards } of visibleDecks) {
        const filtered = flagged.checked ? cards.filter(({ check }) => check) : cards
        if (!filtered.length) continue
        content.append(element('h2', title, 'jp-revisit-title'))
        for (const card of filtered) {
          const article = element('article', '', 'jp-card')
          article.append(element('h3', card.front, 'jp-mode-card-title'))
          article.append(element('p', card.meaning))
          if (card.synonym) article.append(element('p', 'Synonym · ' + card.synonym))
          if (card.antonym) article.append(element('p', 'Antonym · ' + card.antonym))
          article.append(element('p', card.example))
          if (card.trap) article.append(element('p', 'Common mistake · ' + card.trap))
          if (card.rule) {
            article.append(element('p', card.rule.text))
            article.append(element('p', 'Right · ' + card.rule.right))
            article.append(element('p', 'Wrong · ' + card.rule.wrong))
          }
          if (card.check) article.append(element('p', 'Review · ' + card.note))
          const source = card.jamb ? 'JAMB ' + card.jamb.year + ' · Question ' + card.jamb.number : 'Common spelling error'
          article.append(element('p', source + ' · ' + card.id, 'jp-summary-sub'))
          content.append(article)
          visible++
        }
      }
      container.replaceChildren(content)
      count.value = visible + (visible === 1 ? ' card' : ' cards')
    }

    select.addEventListener('change', render)
    flagged.addEventListener('change', render)
    render()
  </script>
</body>
</html>
